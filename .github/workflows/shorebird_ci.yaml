# Generated by shorebird_ci. Safe to edit.
# Run `shorebird_ci verify` to check for dep graph drift.
# shorebird_ci-managed: dynamic
name: Shorebird CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Manual dispatch runs CI against all packages, bypassing the
  # affected-packages diff. Useful on the first push to a new repo (where
  # there's no diff base) or when you want to force a full re-check.
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      dart_packages: ${{ steps.affected.outputs.dart_packages }}
      flutter_packages: ${{ steps.affected.outputs.flutter_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # affected_packages diffs against origin/main, which isn't in
          # the default shallow checkout. Full history is needed for the
          # diff to resolve.
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - run: dart pub global activate shorebird_ci
      # Verify first so we fail fast if CI coverage is broken and
      # don't waste time computing affected packages.
      - name: Verify CI coverage
        run: shorebird_ci verify
      - id: affected
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::Manual dispatch: running CI against all packages."
            EXTRA_ARGS=--all
          else
            EXTRA_ARGS=
          fi
          DART=$(shorebird_ci affected_packages --sdk dart $EXTRA_ARGS)
          echo "dart_packages=$DART" >> $GITHUB_OUTPUT
          FLUTTER=$(shorebird_ci affected_packages --sdk flutter $EXTRA_ARGS)
          echo "flutter_packages=$FLUTTER" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] && [[ "$DART" == "[]" && "$FLUTTER" == "[]" ]]; then
            echo "::notice::No affected packages in diff vs origin/main. Click 'Run workflow' in the Actions tab to run CI against all packages."
          fi

  dart_ci:
    needs: setup
    if: needs.setup.outputs.dart_packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.dart_packages) }}
    name: ${{ matrix.name }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1
      - name: Setup Bloc Tools
        if: matrix.has_bloc_lint == true
        uses: felangel/setup-bloc-tools@v0
      - name: Install Dependencies
        run: |
          dart pub get --no-example
          for sub in ${{ matrix.subpackages }}; do
            dart pub get --no-example -C $sub
          done
      - run: dart format --set-exit-if-changed .
      - run: dart analyze --fatal-warnings .
      - name: Bloc Lint
        if: matrix.has_bloc_lint == true
        run: bloc lint .
      # Hand-added: `shorebird_ci generate` will drop this step. Each test
      # suite runs in its own isolate and populates the asset cache itself, so
      # a cold cache means dozens of concurrent CDN fetches and intermittent
      # connection resets. Warming once first leaves one fetch.
      - name: Warm asset cache
        run: '[ -f tool/warm_cache.dart ] && dart run tool/warm_cache.dart || true'
      - name: Run Tests
        run: |
          dart pub global activate coverage && \
          dart test --coverage=coverage && \
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore
      - uses: codecov/codecov-action@v6
        with:
          flags: ${{ matrix.name }}

  flutter_ci:
    needs: setup
    if: needs.setup.outputs.flutter_packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.flutter_packages) }}
    name: ${{ matrix.name }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version || '' }}
          channel: ${{ matrix.flutter_version && '' || 'stable' }}
      - name: Setup Bloc Tools
        if: matrix.has_bloc_lint == true
        uses: felangel/setup-bloc-tools@v0
      - name: Install Dependencies
        run: |
          flutter pub get --no-example
          for sub in ${{ matrix.subpackages }}; do
            flutter pub get --no-example -C $sub
          done
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze .
      - name: Bloc Lint
        if: matrix.has_bloc_lint == true
        run: bloc lint .
      # Hand-added, see the dart_ci job: tests read the asset cache but never
      # populate it, so warm it before they run.
      - name: Warm asset cache
        run: '[ -f ../logic/tool/warm_cache.dart ] && dart run ../logic/tool/warm_cache.dart .cache || true'
      - run: flutter test --coverage
      - name: Integration Tests
        if: matrix.has_integration_tests == true
        run: flutter test integration_test
      - uses: codecov/codecov-action@v6
        with:
          flags: ${{ matrix.name }}

  cspell:
    name: CSpell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: streetsidesoftware/cspell-action@v9
        with:
          incremental_files_only: false
          config: cspell.config.yaml

  required:
    name: required
    if: ${{ always() }}
    needs:
      - setup
      - dart_ci
      - flutter_ci
      - cspell
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were skipped because nothing changed)."

